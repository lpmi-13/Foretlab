# Netlify build configuration for the Foret Lab Quarto site.
#
# Netlify build images do not include Quarto, so the build command downloads a
# pinned Quarto release, puts it on PATH, and renders the site. The rendered
# output goes to `_site` (matching `output-dir` in `_quarto.yml`), which Netlify
# then publishes.
#
# To upgrade Quarto, bump QUARTO_VERSION below.

[build]
  publish = "_site"
  command = """
    curl -fsSL --retry 5 --retry-all-errors -o quarto.tar.gz "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.tar.gz" && \
    mkdir -p quarto && tar -xzf quarto.tar.gz -C quarto --strip-components=1 && \
    export PATH="$PWD/quarto/bin:$PATH" && \
    quarto --version && \
    quarto render
  """

[build.environment]
  QUARTO_VERSION = "1.9.38"

# Basic security headers applied to every response.
#
# The Content-Security-Policy allows 'unsafe-inline' for styles and scripts
# because Quarto's default theme injects inline <style>/<script> blocks; tighten
# it (e.g. with hashes/nonces) if you later remove or audit those.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
