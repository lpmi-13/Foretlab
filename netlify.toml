# Netlify build configuration for the Foret Lab Quarto site.
#
# Netlify build images do not include Quarto, so the build command downloads a
# pinned Quarto release, puts it on PATH, and renders the site. The rendered
# output goes to `_site` (matching `output-dir` in `_quarto.yml`), which Netlify
# then publishes.
#
# To upgrade Quarto, bump QUARTO_VERSION below.

[build]
  publish = "_site"
  command = """
    curl -fsSL "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.tar.gz" | tar -xz && \
    export PATH="$PWD/quarto-${QUARTO_VERSION}/bin:$PATH" && \
    quarto --version && \
    quarto render
  """

[build.environment]
  QUARTO_VERSION = "1.9.38"
